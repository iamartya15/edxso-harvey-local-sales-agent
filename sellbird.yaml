  name: "VidyaSetu School ERP"
  description: "School management software for K-12 schools: admissions, attendance, fees, exams, timetable and parent app in one place."
  pricing: "Rs.4,999/month per school (up to 500 students); Rs.9,999/month above that"
  key_benefits:
