persona:
  name: "Alex"
  company: "Your Company"
  role: "Business Development"
  email: "alex@yourcompany.com"
  linkedin: "linkedin.com/in/alex-yourcompany"
  tone: "professional, consultative, confident"

# EDXSO fork: local-only brain. Ollama on localhost, model qwen3:0.6b.
# No Claude/Codex subscription, no API key, no cloud fallback.
brain:
  provider: ollama
  model: qwen3:0.6b
  ollama_host: "http://localhost:11434"
  ollama_model: qwen3:0.6b

# EDXSO fork: multi-product catalogue. `product:` (first entry) is kept as
# the legacy default; `products:` is the full list, each with its own ICP.
# Sample products mirror data/seed_sample_data.json (fictional, for demo).
