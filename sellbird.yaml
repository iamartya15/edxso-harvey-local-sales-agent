    "not interested": "No problem. Would a 10-minute look at the fee-collection screen be useful, or should I check back next term?"
  offer:
    primary: "Rs.4,999/month per school"
    entry: "14-day free trial with your real timetable imported"
    goal: "book_call"
    booking_method: "suggest_times"
    booking_url: ""
    meeting_duration: "20 minutes"
    meeting_owner: ""
  icp:
    industries: ["K-12 School", "Education"]
    company_size: "20-200 staff"
    titles: ["Principal", "Director", "Administrator", "Head of Administration"]
    geography: ["Uttar Pradesh", "India"]
    hiring_signals: ["Admission Counsellor", "Front Office Executive", "Accountant"]

